modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Server-side block, entity, inventory, command, and explosion history logger.
'''

[[mixins]]
config="space-logger-mod-neoforge.mixins.json"

[[dependencies.${mod_id}]]
